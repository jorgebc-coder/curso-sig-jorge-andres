
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veredas de Boyacá - Mapa Leaflet</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            margin: 12px;
        }

        #map {
            height: 88vh;
            width: 100%;
        }
    </style>
</head>

<body>

    <h2>Veredas de Boyacá</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Crear el mapa
        const map = L.map('map').setView([5.54, -73.36], 8);

        // Mapa base OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Servicio de veredas de Boyacá
        const urlBase =
            'https://services6.arcgis.com/Ex2fmFOuTOHRZtML/ArcGIS/rest/services/Veredas_Boyaca_2024/FeatureServer/0/query';

        // Consultar y cargar las veredas
        async function cargarVeredas() {
            let offset = 0;
            const limite = 1000;
            let todasLasVeredas = [];

            try {
                while (true) {
                    const parametros = new URLSearchParams({
                        where: '1=1',
                        outFields: 'NOMBRE_VER,NOMB_MPIO',
                        outSR: '4326',
                        f: 'geojson',
                        resultRecordCount: limite,
                        resultOffset: offset
                    });

                    const respuesta = await fetch(
                        `${urlBase}?${parametros.toString()}`
                    );

                    if (!respuesta.ok) {
                        throw new Error('Error al consultar el servicio');
                    }

                    const datos = await respuesta.json();

                    if (datos.error) {
                        throw new Error(datos.error.message);
                    }

                    const entidades = datos.features || [];

                    todasLasVeredas = todasLasVeredas.concat(entidades);

                    if (entidades.length < limite) {
                        break;
                    }

                    offset += limite;
                }

                // Agregar polígonos al mapa
                const capaVeredas = L.geoJSON(
                    {
                        type: 'FeatureCollection',
                        features: todasLasVeredas
                    },
                    {
                        style: {
                            color: '#7B3294',
                            weight: 1,
                            fillColor: '#C2A5CF',
                            fillOpacity: 0.45
                        },

                        onEachFeature: function(feature, layer) {
                            const nombre =
                                feature.properties.NOMBRE_VER || 'Sin nombre';

                            const municipio =
                                feature.properties.NOMB_MPIO || 'Sin municipio';

                            layer.bindPopup(
                                '<b>Vereda:</b> ' + nombre +
                                '<br><b>Municipio:</b> ' + municipio
                            );
                        }
                    }
                ).addTo(map);

                if (capaVeredas.getLayers().length > 0) {
                    map.fitBounds(capaVeredas.getBounds());
                }

                console.log(
                    'Total de veredas cargadas:',
                    todasLasVeredas.length
                );

            } catch (error) {
                console.error('Error cargando las veredas:', error);
                alert('No fue posible cargar las veredas. Revisa la conexión.');
            }
        }

        cargarVeredas();
    </script>

</body>
</html>
